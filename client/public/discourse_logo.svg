<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0891B2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E7490;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="24" cy="24" r="22" fill="url(#logoGradient)"/>
  
  <!-- Speech bubbles forming "D" shape -->
  <!-- Left bubble -->
  <circle cx="18" cy="16" r="6" fill="white" opacity="0.95"/>
  <!-- Middle bubble -->
  <circle cx="24" cy="24" r="8" fill="white" opacity="0.9"/>
  <!-- Right bubble -->
  <circle cx="18" cy="32" r="6" fill="white" opacity="0.95"/>
  
  <!-- Center accent circle -->
  <circle cx="32" cy="24" r="5" fill="white" opacity="0.85"/>
  
  <!-- Connecting lines -->
  <path d="M 20 20 Q 26 22 32 24" stroke="white" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 20 28 Q 26 26 32 24" stroke="white" stroke-width="1.5" fill="none" opacity="0.6"/>
</svg>
